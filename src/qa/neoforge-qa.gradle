import groovy.json.JsonOutput
import java.nio.file.Files
import java.time.Duration

def qaRoot = rootProject.layout.projectDirectory.dir('src/qa/neoforge')
def ic2VersionProp = rootProject.property('ic2_version')
def ic2DepJar = rootProject.file(".ic2-deps/ic2-neoforge-${minecraftVersion}-${ic2VersionProp}.jar")
def lc2Candidates = [
        providers.gradleProperty('lc2Jar').orNull ? file(providers.gradleProperty('lc2Jar').get()) : null,
        rootProject.file(".ic2-deps/lc2-neoforge-${minecraftVersion}-1.1.0.jar"),
        rootProject.file("../LC2/src/neoforge/${minecraftVersion}/build/libs/lc2-neoforge-${minecraftVersion}-1.1.0.jar")
].findAll { it != null }
def lc2DepJar = lc2Candidates.find { it.isFile() } ?: lc2Candidates.last()

if (!ic2DepJar.isFile()) {
    throw new GradleException("Missing IC2 dependency JAR for QA: ${ic2DepJar}")
}
if (!lc2DepJar.isFile()) {
    throw new GradleException("Missing LC2 dependency JAR for QA: ${lc2DepJar}")
}

sourceSets {
    qa {
        java.setSrcDirs([
                qaRoot.dir('shared/src/main/java'),
                qaRoot.dir(platformJava == 21 ? '1.21.1/src/main/java' : '26.x/src/main/java'),
                qaRoot.dir(minecraftVersion == '26.2' ? 'client-26.2/src/main/java'
                        : (platformJava == 21 ? 'client-1.21.1/src/main/java' : 'client-26.1.2/src/main/java'))
        ])
        resources.setSrcDirs([qaRoot.dir('resources')])
    }
}

neoForge.addModdingDependenciesTo(sourceSets.qa)

dependencies {
    qaCompileOnly sourceSets.main.output
    qaCompileOnly project(':common')
    qaCompileOnly files(ic2DepJar)
}

tasks.named('processQaResources') {
    filteringCharset = 'UTF-8'
    inputs.property('loaderMetadata', loaderMetadata)
    filesMatching('META-INF/neoforge.mods.toml') {
        expand(loaderMetadata: loaderMetadata)
    }
}

def qaMod = neoForge.mods.create('tyc2_qa') {
    sourceSet sourceSets.qa
}

def productionTyc2Jar = tasks.named('jar', Jar).flatMap { it.archiveFile }

def loadQaProperties = { File file ->
    if (!file.isFile()) {
        throw new GradleException("Missing TyC2 QA report file: ${file}")
    }
    def props = new Properties()
    file.withReader('UTF-8') { props.load(it) }
    props
}

def scanLatestLogForErrors = { File runDir, String profile, String phaseName ->
    def logFile = new File(runDir, 'logs/latest.log')
    if (!logFile.isFile()) {
        throw new GradleException("Missing server latest.log after QA ${profile}/${phaseName}: ${logFile}")
    }
    def badLines = []
    def lines = logFile.readLines('UTF-8')
    lines.eachWithIndex { line, idx ->
        def lower = line.toLowerCase(Locale.ROOT)
        boolean isMixinError = line.contains('MixinApplyError')
                || line.contains('InvalidMixinException')
                || line.contains('MixinTransformerError')
                || line.contains('MixinPrepareError')
                || line.contains('Critical injection failure')
                || (lower.contains('mixin') && lower.contains('tyc2') && (lower.contains('error') || lower.contains('failed')))
        boolean isClassLoadingError = line.contains('NoClassDefFoundError')
                || line.contains('ClassNotFoundException')
                || line.contains('NoSuchMethodError')
                || line.contains('NoSuchFieldError')
                || line.contains('AbstractMethodError')
                || line.contains('IncompatibleClassChangeError')
        boolean isTyc2Error = (line.contains('/ERROR]') || line.contains('Exception') || line.contains('AssertionError'))
                && (line.contains('com.tycooncraft.tyc2')
                    || line.contains('tyc2:')
                    || line.contains('tyc2.mixins.json')
                    || (lower.contains('failed to load mod') && lower.contains('tyc2'))
                    || (lower.contains('error loading recipe') && lower.contains('tyc2'))
                    || (lower.contains('failed to parse tyc2')))
        if (isMixinError || isClassLoadingError || isTyc2Error) {
            badLines << "L${idx + 1}: ${line}"
        }
    }
    if (!badLines.isEmpty()) {
        throw new GradleException(
                "TyC2/Mixin/ClassLoad errors detected in ${logFile} during QA ${profile}/${phaseName}:\n"
                        + badLines.take(25).join('\n')
        )
    }
}

['standalone', 'enhanced'].each { profile ->
    def runDir = layout.buildDirectory.dir("run/tyc2-qa-${profile}")
    ['write', 'read'].each { phase ->
        def runName = "qa${profile.capitalize()}${phase.capitalize()}"
        neoForge.runs.create(runName) {
            server()
            programArgument '--nogui'
            sourceSet.set(sourceSets.qa)
            loadedMods.set([qaMod])
            gameDirectory.set(runDir)
            systemProperty 'tyc2.qa.mode', 'flat'
            systemProperty 'tyc2.qa.profile', profile
            systemProperty 'tyc2.qa.phase', phase
            systemProperty 'tyc2.qa.mcVersion', minecraftVersion
            systemProperty 'tyc2.qa.expectedTyc2Jar', "tyc2-neoforge-${minecraftVersion}-${project.version}.jar"
            systemProperty 'tyc2.qa.expectedIc2Jar', ic2DepJar.name
            systemProperty 'tyc2.qa.expectedLc2Jar', lc2DepJar.name
        }

        tasks.named("run${runName.capitalize()}", JavaExec) {
            group = 'verification'
            timeout.set(Duration.ofMinutes(6))
            dependsOn 'jar'
            if (phase == 'read') {
                dependsOn "runQa${profile.capitalize()}Write"
            }
            doFirst {
                def dir = runDir.get().asFile
                def tyc2Artifact = productionTyc2Jar.get().asFile
                if (phase == 'write') {
                    delete dir
                    dir.mkdirs()
                    def modsDir = new File(dir, 'mods')
                    modsDir.mkdirs()
                    copy {
                        from tyc2Artifact
                        if (profile == 'enhanced') {
                            from ic2DepJar
                            from lc2DepJar
                        }
                        into modsDir
                    }
                    new File(dir, 'eula.txt').text = 'eula=true\n'
                    new File(dir, 'server.properties').text = '''server-ip=127.0.0.1
server-port=0
online-mode=false
level-name=world
level-seed=20261123
generate-structures=false
spawn-protection=0
view-distance=4
simulation-distance=4
difficulty=peaceful
level-type=minecraft:flat
generator-settings={"layers":[{"block":"minecraft:bedrock","height":1},{"block":"minecraft:stone","height":60},{"block":"minecraft:dirt","height":2},{"block":"minecraft:grass_block","height":1}],"biome":"minecraft:plains","structure_overrides":[]}
'''
                }
                def installedTyc2 = new File(dir, "mods/${tyc2Artifact.name}")
                if (!installedTyc2.isFile() || Files.mismatch(installedTyc2.toPath(), tyc2Artifact.toPath()) != -1) {
                    throw new GradleException("QA must load the exact packaged TyC2 JAR: ${tyc2Artifact}")
                }
                if (profile == 'standalone') {
                    def extraJars = new File(dir, 'mods').listFiles()?.findAll { it.name.endsWith('.jar') && it.name != tyc2Artifact.name }
                    if (extraJars && !extraJars.isEmpty()) {
                        throw new GradleException("Standalone QA mods/ must contain ONLY TyC2 JAR, found: ${extraJars}")
                    }
                } else {
                    def installedIc2 = new File(dir, "mods/${ic2DepJar.name}")
                    def installedLc2 = new File(dir, "mods/${lc2DepJar.name}")
                    if (!installedIc2.isFile() || !installedLc2.isFile()) {
                        throw new GradleException("Enhanced QA missing IC2/LC2 JARs in ${dir}/mods")
                    }
                }
            }
            doLast {
                def dir = runDir.get().asFile
                def tyc2Artifact = productionTyc2Jar.get().asFile
                def reportFile = new File(dir, "qa-report-${profile}-${phase}.properties")
                def jsonFile = new File(dir, "qa-report-${profile}-${phase}.json")
                def result = loadQaProperties(reportFile)
                if (!jsonFile.isFile()) {
                    throw new GradleException("Missing structured JSON QA report: ${jsonFile}")
                }
                if (result.status != 'passed') {
                    throw new GradleException(
                            "TyC2 NeoForge ${minecraftVersion} QA [${profile}/${phase}] FAILED: ${result.problem}\n${result.getProperty('trace', '')}"
                    )
                }
                if (result.tyc2Artifact != tyc2Artifact.name) {
                    throw new GradleException("QA loaded unexpected TyC2 JAR: ${result.tyc2Artifact}")
                }
                if (!new File(dir, 'world/level.dat').isFile()) {
                    throw new GradleException("Missing saved world/level.dat in ${dir}")
                }
                if (phase == 'read') {
                    def writeResult = loadQaProperties(new File(dir, "qa-report-${profile}-write.properties"))
                    if (result.pid == writeResult.pid) {
                        throw new GradleException("Cold-restart read phase reused write process PID ${result.pid}")
                    }
                }
                scanLatestLogForErrors(dir, profile, phase)
                logger.lifecycle("TyC2 NeoForge ${minecraftVersion} QA [${profile}/${phase}] PASSED (${result.passedCount} checks, ticks=${result.ticks}, pid=${result.pid})")
            }
        }
    }

    tasks.register("tyc2Qa${profile.capitalize()}") {
        group = 'verification'
        description = "Runs TyC2 NeoForge ${minecraftVersion} ${profile} live-server QA (write + cold-restart read)."
        dependsOn "runQa${profile.capitalize()}Read"
    }
}

tasks.register('tyc2QaAll') {
    group = 'verification'
    description = "Runs BOTH Standalone and Enhanced (IC2+LC2) live-server QA suites on NeoForge ${minecraftVersion}."
    dependsOn 'tyc2QaStandalone', 'tyc2QaEnhanced'
}

// --- Real Graphical Client + Dedicated Server Live Joint Test Export ---

def clientLiveOutput = layout.buildDirectory.dir('client-server-live')
def clientLiveRuns = [:]
['server', 'client'].each { side ->
    def runName = "tyc2Live${side.capitalize()}"
    def runDir = layout.buildDirectory.dir("run/client-server-live/template-${side}")
    neoForge.runs.create(runName) {
        if (side == 'client') {
            client()
            programArguments.addAll '--username', 'TycoonTester', '--width', '1280', '--height', '720'
            systemProperty 'tyc2.qa.mode', 'client_only'
            systemProperty 'tyc2.qa.clientDriver', 'true'
        } else {
            server()
            programArgument '--nogui'
            systemProperty 'tyc2.qa.mode', 'client_live'
        }
        sourceSet.set(sourceSets.qa)
        loadedMods.set([qaMod])
        gameDirectory.set(runDir)
        systemProperty 'tyc2.qa.mcVersion', minecraftVersion
    }
    clientLiveRuns[side] = tasks.named("run${runName.capitalize()}", JavaExec)
}

tasks.register('prepareClientServerPlay') {
    group = 'verification'
    description = "Exports launch parameters for live graphical Client + Dedicated Server joint testing on NeoForge ${minecraftVersion}."
    dependsOn 'jar', 'qaClasses'
    dependsOn {
        clientLiveRuns.values().collectMany { provider ->
            def run = provider.get()
            run.taskDependencies.getDependencies(run).toList()
        }
    }
    def manifest = clientLiveOutput.map { it.file('launch.json') }
    outputs.file(manifest)
    outputs.upToDateWhen { false }
    doLast {
        def launch = clientLiveRuns.collectEntries { side, provider ->
            def run = provider.get()
            [(side): [
                    java: run.javaLauncher.get().executablePath.asFile.absolutePath,
                    jvmArgs: run.allJvmArgs,
                    classpath: files(run.classpath, run.classpathProvider).asPath,
                    mainClass: run.mainClass.get(),
                    args: run.args + run.argumentProviders.collectMany { it.asArguments().toList() },
                    environment: run.environmentProperty.get().findAll { key, value -> key == 'MOD_CLASSES' }
            ]]
        }
        launch.minecraftVersion = minecraftVersion
        launch.tyc2Jar = productionTyc2Jar.get().asFile.absolutePath
        launch.ic2Jar = ic2DepJar.absolutePath
        launch.lc2Jar = lc2DepJar.absolutePath
        def outFile = manifest.get().asFile
        outFile.parentFile.mkdirs()
        outFile.setText(JsonOutput.prettyPrint(JsonOutput.toJson(launch)) + '\n', 'UTF-8')
    }
}

        outFile.parentFile.mkdirs()
        if (outFile.exists()) {
            outFile.delete()
        }
        def (File renamerJar, File srgForgeJar) = resolveForgeRenamerAndSrg()
        classpath = files(renamerJar)
        def toolArgs = [
                '--reverse',
                '--input', packagedLc2Jar.absolutePath,
                '--output', outFile.absolutePath,
                '--names', mappingsFile.get().asFile.absolutePath,
                '--log', qaBuildDir.get().file('deobf-lc2.log').asFile.absolutePath,
                '--lib', srgForgeJar.absolutePath,
                '--lib', packagedIc2Jar.absolutePath
        ]
        configurations.compileClasspath.files.each { File lib ->
            String n = lib.name
            if (!n.contains('_mapped_official_') && !n.startsWith('ic2-forge-')) {
                toolArgs.addAll(['--lib', lib.absolutePath])
            }
        }
        args = toolArgs
    }
}

// Skip client-only sound/music asset downloads for server-only QA or offline runs when 1.19 assets are already cached.
tasks.matching { it.name == 'downloadAssets' }.configureEach {
    onlyIf {
        if (gradle.startParameter.taskNames.any { name ->
            name.endsWith('runTyc2QaStandalone') || name.endsWith('runTyc2QaEnhanced') || name.endsWith('prepareTyc2ServerQa')
        }) {
            return false
        }
        File cachedIndex = new File(gradle.gradleUserHomeDir, 'caches/forge_gradle/assets/indexes/1.19.json')
        return !(gradle.startParameter.offline && cachedIndex.isFile())
    }
}

def exportQaHostLaunch = { run, side ->
    def generator = plugins.getPlugin('net.minecraftforge.gradle').class.classLoader.loadClass(
            'net.minecraftforge.gradle.common.util.runs.RunConfigGenerator')
    def config = run.runConfig.get()
    def folders = generator.mapModClassesToGradle(project, config)
    def tokens = generator.configureTokensLazy(project, config, folders,
            run.minecraftArtifacts, run.runtimeClasspathArtifacts)
    def expand = { value -> config.replace(tokens, value.toString()) }

    def jvm = config.jvmArgs.collect(expand)
    if (side == 'client') {
        jvm += run.additionalClientArgs.get().collect(expand)
    }
    jvm += config.properties.collect { key, value -> "-D${key}=${expand(value)}" }
    def env = config.environment.collectEntries { key, value -> [(key): expand(value)] }

    // Keep ONLY tyc2_qa in MOD_CLASSES so Forge MUST load tyc2 from mods/tyc2-forge-1.19.2-1.0.0.jar!
    if (env.containsKey('MOD_CLASSES')) {
        def sep = File.pathSeparator
        def kept = env['MOD_CLASSES'].split(java.util.regex.Pattern.quote(sep))
                .findAll { it.startsWith('tyc2_qa%%') }
        if (kept.isEmpty()) {
            throw new GradleException("Expected tyc2_qa entries in MOD_CLASSES for ${side}, got: ${env['MOD_CLASSES']}")
        }
        env['MOD_CLASSES'] = kept.join(sep)
    }

    // Strip sourceSets.main output directories from JVM classpath so they cannot shadow mods/tyc2-*.jar
    Set<File> mainOutputs = sourceSets.main.output.files.collect { it.canonicalFile } as Set
    def cpFiles = files(run.classpath, sourceSets.qa.runtimeClasspath).files
            .findAll { !mainOutputs.contains(it.canonicalFile) }

    return [
            java     : run.javaLauncher.get().executablePath.asFile.absolutePath,
            main     : run.mainClass.get(),
            jvm      : jvm,
            args     : config.args.collect(expand),
            env      : env,
            classpath: cpFiles.collect { it.absolutePath }.join(File.pathSeparator)
    ]
}

def prepareTyc2ServerQa = tasks.register('prepareTyc2ServerQa') {
    group = 'verification'
    description = 'Stages packaged TyC2 (+ IC2/LC2) JARs and exports Forge 1.19.2 dedicated server QA manifest.'
    dependsOn 'qaClasses', deobfPackagedTyc2Jar, deobfPackagedLc2Jar
    dependsOn {
        def run = tasks.getByName('runQaTyc2Server')
        run.taskDependencies.getDependencies(run).toList()
    }
    def launchManifest = qaBuildDir.map { it.file('server-launch.json') }
    outputs.file(launchManifest)
    outputs.upToDateWhen { false }
    doLast {
        File tyc2DeobfJar = deobfPackagedTyc2Jar.get().outputs.files.singleFile
        File ic2DeobfJar = configurations.qaIc2Mod.singleFile
        File lc2DeobfJar = deobfPackagedLc2Jar.get().outputs.files.singleFile
        def manifest = [
                server         : exportQaHostLaunch(tasks.getByName('runQaTyc2Server'), 'server'),
                tyc2ModJar     : tyc2DeobfJar.absolutePath,
                ic2ModJar      : ic2DeobfJar.absolutePath,
                lc2ModJar      : lc2DeobfJar.absolutePath,
                packagedTyc2Jar: packagedTyc2Jar.get().asFile.absolutePath,
                packagedIc2Jar : packagedIc2Jar.absolutePath,
                packagedLc2Jar : packagedLc2Jar.absolutePath,
                runBaseDir     : layout.buildDirectory.dir('run/qa-tyc2').get().asFile.absolutePath,
                reportDir      : qaBuildDir.get().asFile.absolutePath
        ]
        File target = launchManifest.get().asFile
        target.parentFile.mkdirs()
        target.setText(JsonOutput.prettyPrint(JsonOutput.toJson(manifest)) + '\n', 'UTF-8')
    }
}

def prepareTyc2LiveQa = tasks.register('prepareTyc2LiveQa') {
    group = 'verification'
    description = 'Stages packaged TyC2 (+ IC2/LC2) JARs and exports Dedicated Server + Graphical Client manifest.'
    dependsOn 'qaClasses', deobfPackagedTyc2Jar, deobfPackagedLc2Jar
    dependsOn {
        ['runLiveTyc2Server', 'runLiveTyc2Client'].collectMany { name ->
            def run = tasks.getByName(name)
            run.taskDependencies.getDependencies(run).toList()
        }
    }
    def launchManifest = qaBuildDir.map { it.file('live-launch.json') }
    outputs.file(launchManifest)
    outputs.upToDateWhen { false }
    doLast {
        File tyc2DeobfJar = deobfPackagedTyc2Jar.get().outputs.files.singleFile
        File ic2DeobfJar = configurations.qaIc2Mod.singleFile
        File lc2DeobfJar = deobfPackagedLc2Jar.get().outputs.files.singleFile
        def manifest = [
                server         : exportQaHostLaunch(tasks.getByName('runLiveTyc2Server'), 'server'),
                client         : exportQaHostLaunch(tasks.getByName('runLiveTyc2Client'), 'client'),
                tyc2ModJar     : tyc2DeobfJar.absolutePath,
                ic2ModJar      : ic2DeobfJar.absolutePath,
                lc2ModJar      : lc2DeobfJar.absolutePath,
                packagedTyc2Jar: packagedTyc2Jar.get().asFile.absolutePath,
                packagedIc2Jar : packagedIc2Jar.absolutePath,
                packagedLc2Jar : packagedLc2Jar.absolutePath,
                runBaseDir     : layout.buildDirectory.dir('run/live-tyc2').get().asFile.absolutePath,
                reportDir      : qaBuildDir.get().asFile.absolutePath
        ]
        File target = launchManifest.get().asFile
        target.parentFile.mkdirs()
        target.setText(JsonOutput.prettyPrint(JsonOutput.toJson(manifest)) + '\n', 'UTF-8')
    }
}

tasks.register('runTyc2QaStandalone', Exec) {
    group = 'verification'
    description = 'Runs Forge 1.19.2 Standalone Dedicated Server QA (ONLY tyc2, write + cold-restart read).'
    dependsOn prepareTyc2ServerQa
    outputs.upToDateWhen { false }
    doFirst {
        commandLine 'python3',
                file('src/qa/run_qa_server.py').absolutePath,
                '--manifest', qaBuildDir.get().file('server-launch.json').asFile.absolutePath,
                '--profile', 'standalone'
    }
}

tasks.register('runTyc2QaEnhanced', Exec) {
    group = 'verification'
    description = 'Runs Forge 1.19.2 Enhanced Dedicated Server QA (tyc2 + ic2 + lc2, write + cold-restart read).'
    dependsOn prepareTyc2ServerQa
    outputs.upToDateWhen { false }
    doFirst {
        commandLine 'python3',
                file('src/qa/run_qa_server.py').absolutePath,
                '--manifest', qaBuildDir.get().file('server-launch.json').asFile.absolutePath,
                '--profile', 'enhanced'
    }
}

tasks.register('runTyc2LiveClientServer', Exec) {
    group = 'verification'
    description = 'Runs Forge 1.19.2 Real Graphical Client + Dedicated Server Joint Test.'
    dependsOn prepareTyc2LiveQa
    outputs.upToDateWhen { false }
    doFirst {
        def profile = providers.gradleProperty('tyc2LiveProfile').getOrElse('enhanced')
        def lang = providers.gradleProperty('tyc2LiveLang').getOrElse('en_us')
        def shotsDir = providers.gradleProperty('tyc2LiveScreenshotsDir').orNull
        def cmd = [
                'python3',
                file('src/qa/run_client_server_live.py').absolutePath,
                '--manifest', qaBuildDir.get().file('live-launch.json').asFile.absolutePath,
                '--profile', profile,
                '--lang', lang
        ]
        if (shotsDir != null && !shotsDir.trim().isEmpty()) {
            cmd.addAll(['--screenshots-dir', shotsDir])
        }
        commandLine cmd
    }
}

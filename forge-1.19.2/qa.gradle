import groovy.json.JsonOutput
import groovy.json.JsonSlurper
import java.util.jar.JarFile

// Dedicated Forge 1.19.2 live-server & live client-server QA sourceSet and tasks for TyC2.
// Strictly isolated from sourceSets.main so ZERO QA classes or resources enter tyc2-forge-1.19.2-1.0.0.jar.

sourceSets {
    qa {
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        // Do NOT put sourceSets.main.output on qa.runtimeClasspath: at runtime Forge loads the
        // packaged tyc2-forge-1.19.2-1.0.0.jar directly from mods/.
        runtimeClasspath += configurations.runtimeClasspath
    }
}

configurations {
    qaIc2Mod {
        canBeConsumed = false
        canBeResolved = true
    }
}

dependencies {
    qaIc2Mod fg.deobf("com.industrialage.ia2:ic2-forge-1.19.2:${ic2_version}")
}

minecraft {
    runs {
        serverQaTyc2 {
            taskName 'runQaTyc2Server'
            parent runs.server
            workingDirectory layout.buildDirectory.dir('run/qa-tyc2-server').get().asFile
            property 'forge.logging.console.level', 'info'
            property 'tyc2.qa.mode', 'server_write'
            property 'tyc2.qa.profile', 'standalone'
            mods {
                tyc2_qa {
                    source sourceSets.qa
                }
            }
        }
        serverLiveTyc2 {
            taskName 'runLiveTyc2Server'
            parent runs.server
            workingDirectory layout.buildDirectory.dir('run/live-tyc2-server').get().asFile
            property 'forge.logging.console.level', 'info'
            property 'tyc2.qa.mode', 'live_server'
            property 'tyc2.qa.profile', 'enhanced'
            mods {
                tyc2_qa {
                    source sourceSets.qa
                }
            }
        }
        clientLiveTyc2 {
            taskName 'runLiveTyc2Client'
            parent runs.client
            workingDirectory layout.buildDirectory.dir('run/live-tyc2-client').get().asFile
            property 'forge.logging.console.level', 'info'
            property 'tyc2.qa.mode', 'live_client'
            property 'tyc2.qa.profile', 'enhanced'
            mods {
                tyc2_qa {
                    source sourceSets.qa
                }
            }
        }
    }
}

def qaBuildDir = layout.buildDirectory.dir('qa-tyc2')
def qaModsDir = qaBuildDir.map { it.dir('mods') }
def packagedTyc2Jar = tasks.named('jar', Jar).flatMap { it.archiveFile }
def packagedIc2Jar = file("../.ic2-deps/ic2-forge-1.19.2-${ic2_version}.jar")
def lc2Candidates = [
        providers.gradleProperty('lc2Jar').orNull ? file(providers.gradleProperty('lc2Jar').get()) : null,
        file('../.ic2-deps/lc2-forge-1.19.2-1.1.0.jar'),
        file('../../LC2/forge-1.19.2/build/libs/lc2-forge-1.19.2-1.1.0.jar')
].findAll { it != null }
def packagedLc2Jar = lc2Candidates.find { it.isFile() } ?: lc2Candidates.last()

// 1. Audit the exact SRG-reobfuscated production JAR before runtime execution.
def auditPackagedTyc2Jar = tasks.register('auditPackagedTyc2Jar') {
    group = 'verification'
    description = 'Verifies production tyc2-forge-1.19.2 JAR has zero QA/preview leaks, zero hard IC2 deps, valid MixinConfigs, assets, datapacks, and SRG bytecode.'
    dependsOn 'reobfJar'
    inputs.file(packagedTyc2Jar)
    doLast {
        File jarFile = packagedTyc2Jar.get().asFile
        if (!jarFile.isFile()) {
            throw new GradleException("Missing packaged production JAR: ${jarFile}")
        }
        new JarFile(jarFile).withCloseable { jf ->
            def manifest = jf.manifest
            if (manifest == null) {
                throw new GradleException("Packaged JAR missing META-INF/MANIFEST.MF")
            }
            def mixinCfg = manifest.mainAttributes.getValue('MixinConfigs')
            if (mixinCfg != 'tyc2.mixins.json') {
                throw new GradleException("Expected MixinConfigs=tyc2.mixins.json in MANIFEST.MF, got: ${mixinCfg}")
            }
            def entries = jf.entries().toList().collect { it.name }
            def qaLeaks = entries.findAll { it.contains('tyc2_qa') || it.startsWith('com/tycooncraft/tyc2/qa/') }
            if (!qaLeaks.isEmpty()) {
                throw new GradleException("Production JAR leaked QA entries: ${qaLeaks}")
            }
            def previewLeaks = entries.findAll { it.toLowerCase().contains('preview') && it.endsWith('.png') }
            if (!previewLeaks.isEmpty()) {
                throw new GradleException("Production JAR leaked preview PNGs: ${previewLeaks}")
            }
            def requiredEntries = [
                    'LICENSE',
                    'tyc2.mixins.json',
                    'wthit_plugins.json',
                    'META-INF/mods.toml',
                    'assets/tyc2/lang/en_us.json',
                    'assets/tyc2/lang/zh_cn.json',
                    'assets/tyc2/textures/block/primitive_mint_machine_front.png',
                    'assets/tyc2/textures/block/primitive_mint_machine_front_active.png',
                    'assets/tyc2/textures/gui/primitive_mint_machine.png',
                    'assets/tyc2/textures/gui/mint_machine.png',
                    'data/tyc2/recipes/primitive_mint_machine.json',
                    'data/tyc2/recipes/mint_machine_ic2.json',
                    'data/tyc2/recipes/mint_machine_standalone.json',
                    'data/tyc2/mint_recipes/default_vanilla.json',
                    'data/tyc2/mint_recipes/default_ic2.json',
                    'data/tyc2/goods/vanilla.json',
                    'data/tyc2/goods/ic2.json',
                    'data/tyc2/goods/ecc2.json',
                    'data/tyc2/goods/farmers_delight.json',
                    'data/tyc2/goods/kaleidoscope_cookery.json',
                    'data/tyc2/seasons/harvest_seasons.json',
                    'data/tyc2/levels/village_levels.json'
            ]
            for (String req : requiredEntries) {
                if (!entries.contains(req)) {
                    throw new GradleException("Production JAR missing required entry: ${req}")
                }
            }
            if (entries.contains('data/tyc2/recipes/mint_machine.json')) {
                throw new GradleException("Production JAR still contains stale unconditional data/tyc2/recipes/mint_machine.json")
            }
            def texturePngs = entries.findAll { it.startsWith('assets/tyc2/textures/') && it.endsWith('.png') }
            if (texturePngs.size() != 35) {
                throw new GradleException("Expected 35 texture PNGs in Forge 1.19.2 JAR, found ${texturePngs.size()}: ${texturePngs}")
            }
            // Verify zh_cn.json & en_us.json key parity, %s placeholder parity, and ZERO mechanic-advertising strings
            def slurper = new JsonSlurper()
            Map enLang = (Map) slurper.parseText(new String(jf.getInputStream(jf.getEntry('assets/tyc2/lang/en_us.json')).bytes, 'UTF-8'))
            Map zhLang = (Map) slurper.parseText(new String(jf.getInputStream(jf.getEntry('assets/tyc2/lang/zh_cn.json')).bytes, 'UTF-8'))
            if (enLang.keySet() != zhLang.keySet()) {
                throw new GradleException("Lang key mismatch between en_us.json (${enLang.size()}) and zh_cn.json (${zhLang.size()})")
            }
            def bannedPhrases = ['1000 格', '1000格', '千格', '0-499', '500-999', '防爆', '防破坏', 'blast-proof', '1000-slot', 'CL:3x3']
            def langViolations = []
            for (String k : enLang.keySet()) {
                String ev = String.valueOf(enLang[k])
                String zv = String.valueOf(zhLang[k])
                if (ev.count('%s') != zv.count('%s')) {
                    langViolations << "placeholder mismatch on ${k}: en='${ev}' vs zh='${zv}'"
                }
                for (String banned : bannedPhrases) {
                    if (ev.toLowerCase().contains(banned.toLowerCase())) {
                        langViolations << "en_us[${k}] contains banned '${banned}': ${ev}"
                    }
                    if (zv.toLowerCase().contains(banned.toLowerCase())) {
                        langViolations << "zh_cn[${k}] contains banned '${banned}': ${zv}"
                    }
                }
            }
            if (!langViolations.isEmpty()) {
                throw new GradleException("Lang audit failed: ${langViolations.take(10)}")
            }
            // Verify ZERO com/industrialage references outside compat/ and mixin/
            def badIc2Refs = []
            for (String cls : entries.findAll { it.endsWith('.class') }) {
                if (cls.contains('/compat/') || cls.contains('/mixin/')) {
                    continue
                }
                String ascii = new String(jf.getInputStream(jf.getEntry(cls)).bytes, 'ISO-8859-1')
                if (ascii.contains('com/industrialage') || ascii.contains('com.industrialage')) {
                    badIc2Refs << cls
                }
            }
            if (!badIc2Refs.isEmpty()) {
                throw new GradleException("Non-compat/mixin classes reference com.industrialage: ${badIc2Refs}")
            }
            // Verify SRG reobfuscation on Ic2CableBlockMixin (m_60734_ = BlockState.getBlock)
            def mixinEntry = jf.getEntry('com/tycooncraft/tyc2/forge/mixin/Ic2CableBlockMixin.class')
            if (mixinEntry == null) {
                throw new GradleException("Production JAR missing Ic2CableBlockMixin.class")
            }
            String mixinAscii = new String(jf.getInputStream(mixinEntry).bytes, 'ISO-8859-1')
            if (!mixinAscii.contains('m_60734_')) {
                throw new GradleException("Ic2CableBlockMixin.class does not appear SRG-reobfuscated (missing m_60734_)")
            }
            logger.lifecycle("[TYC2-QA] Packaged Forge 1.19.2 JAR audit PASSED: ${jarFile.name} (${jarFile.length()} bytes, ${entries.size()} entries, 0 QA leaks, 0 hard IC2 deps)")
        }
    }
}

def resolveForgeRenamerAndSrg = {
    File fgCache = new File(gradle.gradleUserHomeDir, 'caches/forge_gradle')
    File renamerJar = new File(fgCache, 'maven_downloader/net/minecraftforge/renamer/2.0.4/renamer-2.0.4-all.jar')
    if (!renamerJar.isFile()) {
        def found = fileTree(new File(fgCache, 'maven_downloader/net/minecraftforge/renamer')) {
            include '**/*-all.jar'
        }.files
        if (found.isEmpty()) {
            throw new GradleException("Could not find Forge renamer jar under ${fgCache}")
        }
        renamerJar = found.first()
    }
    File srgForgeJar = new File(fgCache,
            "minecraft_user_repo/net/minecraftforge/forge/${minecraft_version}-${forge_version}/forge-${minecraft_version}-${forge_version}-srg.jar")
    if (!srgForgeJar.isFile()) {
        throw new GradleException("Missing SRG Forge inheritance jar: ${srgForgeJar}")
    }
    return [renamerJar, srgForgeJar]
}

// 2. Round-trip the exact SRG-reobfuscated production TyC2 JAR to Mojang mappings for ForgeGradle dev runtime.
def deobfPackagedTyc2Jar = tasks.register('deobfPackagedTyc2Jar', JavaExec) {
    group = 'verification'
    description = 'Deobfuscates the exact packaged reobfuscated TyC2 JAR for ForgeGradle runtime.'
    dependsOn 'reobfJar', auditPackagedTyc2Jar, 'createMcpToSrg'
    def outJar = qaModsDir.map { it.file("tyc2-forge-${minecraft_version}-${version}.jar") }
    def mappingsFile = tasks.named('createMcpToSrg').flatMap { it.output }
    inputs.file(packagedTyc2Jar)
    inputs.file(packagedIc2Jar)
    inputs.file(mappingsFile)
    outputs.file(outJar)
    javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(17) }
    mainClass = 'net.minecraftforge.renamer.Main'
    doFirst {
        File outFile = outJar.get().asFile
        outFile.parentFile.mkdirs()
        if (outFile.exists()) {
            outFile.delete()
        }
        def (File renamerJar, File srgForgeJar) = resolveForgeRenamerAndSrg()
        classpath = files(renamerJar)
        def toolArgs = [
                '--reverse',
                '--input', packagedTyc2Jar.get().asFile.absolutePath,
                '--output', outFile.absolutePath,
                '--names', mappingsFile.get().asFile.absolutePath,
                '--log', qaBuildDir.get().file('deobf-tyc2.log').asFile.absolutePath,
                '--lib', srgForgeJar.absolutePath,
                '--lib', packagedIc2Jar.absolutePath
        ]
        configurations.compileClasspath.files.each { File lib ->
            String n = lib.name
            if (!n.contains('_mapped_official_') && !n.startsWith('ic2-forge-')) {
                toolArgs.addAll(['--lib', lib.absolutePath])
            }
        }
        args = toolArgs
    }
}

// 3. Round-trip the packaged SRG-reobfuscated LC2 1.19.2 JAR to Mojang mappings for Enhanced Mode QA.

name: Build & Audit All 4 Targets

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-all-targets:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17 (Forge 1.19.2)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Capture JAVA_HOME_17
        run: echo "JAVA_HOME_17=$JAVA_HOME" >> "$GITHUB_ENV"

      - name: Set up JDK 25 (NeoForge 26.1.2 / 26.2)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up JDK 21 (Core, Tests, NeoForge 1.21.1)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Python 3
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Fetch compileOnly IC2 v1.0.5 reference JARs
        run: |
          mkdir -p .ic2-deps
          BASE="https://github.com/spectrum527/IndustrialCraft2-The-New-Era/releases/download/v1.0.5"
          curl -fsSL -o .ic2-deps/ic2-forge-1.19.2-1.0.5.jar    "$BASE/ic2-forge-1.19.2-1.0.5.jar"
          curl -fsSL -o .ic2-deps/ic2-neoforge-1.21.1-1.0.5.jar "$BASE/ic2-neoforge-1.21.1-1.0.5.jar"
          curl -fsSL -o .ic2-deps/ic2-neoforge-26.1.2-1.0.5.jar "$BASE/ic2-neoforge-26.1.2-1.0.5.jar"
          curl -fsSL -o .ic2-deps/ic2-neoforge-26.2-1.0.5.jar   "$BASE/ic2-neoforge-26.2-1.0.5.jar"

      - name: Build Core, JUnit 5 Tests, and NeoForge 1.21.1 / 26.1.2 / 26.2
        run: |
          chmod +x gradlew forge-1.19.2/gradlew
          ./gradlew --no-daemon :checkCommonImports :test:test :neoforge:1.21.1:jar :neoforge:26.1.2:jar :neoforge:26.2:jar

      - name: Build and Audit Forge 1.19.2 (Java 17)
        env:
          JAVA_HOME: ${{ env.JAVA_HOME_17 }}
        run: |
          ./forge-1.19.2/gradlew --no-daemon -p forge-1.19.2 build reobfJar auditPackagedTyc2Jar

      - name: Static JAR & Bytecode Audit (All 4 Targets)
        run: python3 src/qa/audit_jars.py

      - name: Upload 4-Target JAR Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: tyc2-jars
          path: |
            forge-1.19.2/build/libs/tyc2-forge-1.19.2-*.jar
            src/neoforge/1.21.1/build/libs/tyc2-neoforge-1.21.1-*.jar
            src/neoforge/26.1.2/build/libs/tyc2-neoforge-26.1.2-*.jar
            src/neoforge/26.2/build/libs/tyc2-neoforge-26.2-*.jar
